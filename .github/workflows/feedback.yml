name: Feedback tests
on:
  push:
    branches: [codex/session-feedback, production-fix]
  pull_request:
    paths:
      - 'server/**'
      - 'public/js/feedback.js'
      - 'test/**'
      - '.github/workflows/feedback.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: feedback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          FEEDBACK_TEST_DATABASE_URL: postgresql://postgres:feedback_test@localhost/postgres
