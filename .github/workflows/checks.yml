name: Main checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check application JavaScript
        run: |
          find server public/js tests test -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run regression tests
        run: node --test tests/*.test.js test/*.test.js
      - name: Verify production Docker build
        run: docker build -t iwrite:ci .
