name: Staging

on:
  push:
    branches:
      - "staging/**"
      - "codex/**"
  workflow_dispatch:

jobs:
  checks:
    name: Staging checks
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate landing JavaScript
        run: node --check public/js/landing.js

      - name: Validate server entrypoint
        run: node --check server/index.js


      - name: Validate session JavaScript
        run: |
          node --check public/js/app.js
          node --check public/js/editor.js
          node --check public/js/workspace-pages.js
          node --check public/js/stories.js
          node --check public/js/notification-policy.js
          node --check public/js/paper-zoom.js
          node --check public/js/api.js

      - name: Check audio and notification policy
        run: node --test tests/editor-audio.test.js tests/notification-policy.test.js
