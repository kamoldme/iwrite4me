<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LGSXDSW496"></script>
  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - iWrite4.me</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png?v=1">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --navy: #12192b;
      --navy-soft: rgba(18, 25, 43, 0.88);
      --ink-light: #dfe7f5;
      --text-soft: rgba(223, 231, 245, 0.72);
      --text-muted: rgba(223, 231, 245, 0.54);
      --paper: rgba(255, 250, 238, 0.88);
      --blue: #a9d4ff;
      --blue-strong: #7fb5e7;
      --gold: #d6bc82;
      --line: rgba(223, 231, 245, 0.2);
      --shadow: rgba(0, 0, 0, 0.32);
    }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Instrument Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-light);
      background:
        linear-gradient(90deg, rgba(18, 25, 43, 0.98) 0%, rgba(18, 25, 43, 0.94) 43%, rgba(18, 25, 43, 0.76) 100%),
        url('/media/hero-classical-background.jpg') center center / cover no-repeat,
        var(--navy);
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 24%, rgba(169, 212, 255, 0.16), transparent 28%),
        radial-gradient(circle at 76% 60%, rgba(214, 188, 130, 0.12), transparent 30%),
        linear-gradient(180deg, rgba(18, 25, 43, 0.2), rgba(18, 25, 43, 0.86));
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(169, 212, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(169, 212, 255, 0.04) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.32;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px clamp(18px, 4vw, 58px) 34px;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: min(1120px, 100%);
      justify-self: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink-light);
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.24);
    }
    .nav-pill {
      color: var(--ink-light);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 18px;
      border: 1px solid rgba(223, 231, 245, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
    }
    .content {
      align-self: center;
      width: min(820px, 100%);
      justify-self: center;
      text-align: center;
      padding: clamp(52px, 7vw, 96px) 0;
    }
    h1 {
      margin: 0;
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(112px, 17vw, 232px);
      font-weight: 500;
      line-height: 0.78;
      letter-spacing: -0.09em;
      color: var(--ink-light);
      text-shadow: 0 34px 74px var(--shadow);
    }
    h2 {
      max-width: 680px;
      margin: 30px 0 0;
      font-size: clamp(42px, 5.4vw, 78px);
      font-weight: 360;
      line-height: 1.04;
      letter-spacing: -0.035em;
      color: var(--ink-light);
    }
    h2::after {
      content: '';
      display: block;
      width: min(280px, 58%);
      height: 4px;
      margin-top: 14px;
      border-radius: 999px;
      background: var(--blue);
      margin-left: auto;
      margin-right: auto;
    }
    .copy {
      max-width: 590px;
      margin: 26px auto 0;
      color: var(--text-soft);
      font-size: clamp(17px, 1.7vw, 20px);
      line-height: 1.66;
      font-weight: 500;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px;
      margin-top: 34px;
    }
    .btn {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 24px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .btn-primary {
      color: #14233b;
      background: var(--blue);
      box-shadow: 0 16px 34px rgba(169, 212, 255, 0.26);
    }
    .btn-secondary {
      color: var(--ink-light);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(223, 231, 245, 0.22);
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    @media (max-width: 820px) {
      body {
        background-position: 54% center;
      }
      .page {
        padding: 22px 16px 28px;
      }
      .brand {
        font-size: 20px;
      }
      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }
      .nav-pill {
        display: none;
      }
      .content {
        padding: 68px 0 52px;
      }
      h1 {
        font-size: clamp(112px, 36vw, 164px);
      }
      h2 {
        font-size: clamp(38px, 11vw, 58px);
      }
      .copy {
        font-size: 16px;
      }
      .actions {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="404 navigation">
      <a class="brand" href="/">
        <img src="/media/iwrite-logo.png" alt="" aria-hidden="true">
        <span>iWrite4.me</span>
      </a>
      <a class="nav-pill" href="/">Back to the writing room</a>
    </nav>

    <section class="content" aria-labelledby="not-found-title">
      <div>
        <h1 id="not-found-title">404</h1>
        <h2>Page not found.</h2>
        <p class="copy">
          This page does not exist. Go home or return to the writing app.
        </p>
        <div class="actions">
          <a class="btn btn-primary" href="/app">Start writing</a>
          <a class="btn btn-secondary" href="/">Go home</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
